name: tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    name: unit tests (py ${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests (stdlib, no dependencies)
        run: python -m unittest discover -v

      - name: Set up Node for dashboard behavior tests
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run dashboard and presentation evidence tests (no dependencies)
        run: node --test test_dashboard.cjs test_strategy_deck.cjs

      - name: Smoke-test the pipeline end-to-end
        run: python analyze.py
